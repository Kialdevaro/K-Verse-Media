name: K-Verse Hyper Automation 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  hyper-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Jalankan Mesin Bot ID & Merek Random 24/7
        env:
          SUPABASE_URL: "https://szuntuuhxcetqafaazai.supabase.co/rest/v1/kverse_posts"
          SUPABASE_USERS_URL: "https://szuntuuhxcetqafaazai.supabase.co/rest/v1/kverse_users"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6dW50dXVoeGNldHFhZmFhemFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDk2NzgsImV4cCI6MjEwNjUyNTY3OH0.0GKmzbPNYzWEHzuPhAIx-zmGZA6Sf2Y-jEQsD1hH5Kc"
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import random
          import os
          from datetime import datetime, timezone, timedelta

          url = os.environ["SUPABASE_URL"]
          users_url = os.environ["SUPABASE_USERS_URL"]
          key = os.environ["SUPABASE_KEY"]

          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
          }

          # Matriks Merek & ID Acak yang Dinamis
          brand_prefixes = ["Kialdevaro", "K-Verse", "Cyber", "Pixel", "Neon", "Nova", "Quantum", "Shadow", "Nexus", "Stellar", "Vortex", "Apex"]
          brand_suffixes = ["Gaming ⚡", "INSIGHT 🌐", "AI 🤖", "Game 🎮", "Group 🚀", "Media 🎬", "Studio 💻", "Hub ✨", "Network 📈", "Elite 🏆"]

          # 1. Inisialisasi 100 Bot dengan Nama Merek & ID Unik di kverse_users
          bots_cache = []
          for i in range(1, 101):
              b_uid = f"bot-user-{i}"
              b_name = f"{random.choice(brand_prefixes)} {random.choice(brand_suffixes)}"
              b_email = f"bot{i}@kverse.local"
              b_fid = f"KV-{random.randint(100000, 999999)}"
              b_avatar = f"https://picsum.photos/seed/botavatar-{i}/150/150"
              
              bots_cache.append({
                  "uid": b_uid,
                  "name": b_name,
                  "avatar": b_avatar
              })

              user_payload = json.dumps({
                  "uid": b_uid,
                  "name": b_name,
                  "email": b_email,
                  "avatar": b_avatar,
                  "friendId": b_fid,
                  "xp": random.randint(10, 800)
              }).encode('utf-8')
              
              req_u = urllib.request.Request(users_url + "?on_conflict=uid", data=user_payload, headers=headers, method="POST")
              try:
                  urllib.request.urlopen(req_u)
              except Exception as e:
                  pass

          # 2. Matriks Bahasa Relate (Kombinasi Dinamis Jutaan Variasi)
          prefixes = [
              "Lagi seru banget nih", "Baru tahu kalau", "Pengalaman seru main", "Tips asik buat", 
              "Ngecek performa", "Eksplorasi tanpa batas di", "Nostalgia parah sama", "Pembahasan santai seputar",
              "Gak nyangka ternyata", "Rekomendasi terbaik untuk", "Mulai hari ini coba", "Sesi gaming santai dengan"
          ]
          topics = [
              "game klasik PS1 langsung di browser", "layout CSS Blogger responsif anti ribet", 
              "katalog HTML5 Playgama gratis", "Shopee Affiliate & Buylink digital storefront", 
              "editing video pendek cinematic pakai CapCut", "setup Gran Turismo PSP biar makin gacor", 
              "tema dark aesthetic ala street style", "integrasi AI chatbot Dify di situs web"
          ]
          suffixes = [
              "bikin ketagihan terus! 🚀", "sukses bikin performa naik drastis 🔥", "wajib banget dicoba kawan-kawan 🕹️", 
              "lest go, makin produktif! ✨", "keren parah gak ada obat 💯", "hasilnya bener-bener memuaskan 📈", 
              "auto gacor dan lancar jaya! ⚡", "paling juara buat dicoba hari ini 🌟"
          ]

          # Kirim 2 postingan otomatis dari bot/merek random setiap kali aksi berjalan
          for _ in range(2):
              chosen_bot = random.choice(bots_cache)
              text = f"{random.choice(prefixes)} {random.choice(topics)}, {random.choice(suffixes)}"
              
              # 500rb Kombinasi Gambar Random (Seed 1 s.d 500.000)
              img_id = random.randint(1, 500000)
              image = f"https://picsum.photos/seed/kverse-img-{img_id}/600/400"

              post_data = json.dumps({
                  "author_uid": chosen_bot["uid"],
                  "author_name": chosen_bot["name"],
                  "author_avatar": chosen_bot["avatar"],
                  "text": text,
                  "image": image,
                  "likes": "[]",
                  "comments": "[]"
              }).encode('utf-8')

              req = urllib.request.Request(url, data=post_data, headers=headers, method="POST")
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Post error:", e)

          # 3. Tambah 1 - 5 XP acak untuk Owner (KV-230901) dan semua Bot setiap siklus
          try:
              req_users = urllib.request.Request(users_url + "?select=uid,friendId,xp,email", headers=headers)
              with urllib.request.urlopen(req_users) as resp:
                  users = json.loads(resp.read().decode())
                  for u in users:
                      is_owner = u.get('friendId') == 'KV-230901' or (u.get('email') and u.get('email').lower().strip() == 'akunwildrift2020@gmail.com')
                      is_bot = 'bot' in str(u.get('uid', ''))
                      if is_owner or is_bot:
                        inc = random.randint(1, 5)
                        new_xp = (u.get('xp') or 0) + inc
                        patch_url = f"{users_url}?uid=eq.{u['uid']}"
                        patch_data = json.dumps({"xp": new_xp}).encode('utf-8')
                        patch_req = urllib.request.Request(patch_url, data=patch_data, headers=headers, method='PATCH')
                        urllib.request.urlopen(patch_req)
          except Exception as e:
              print("XP update error:", e)

          # 4. Hapus Postingan Bot Berusia Lebih dari 24 Jam
          yesterday = (datetime.now(timezone.utc) - timedelta(hours=24)).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          del_url = f"{url}?author_uid=like.bot-user-*&created_at=lt.{yesterday}"
          del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
          try:
              urllib.request.urlopen(del_req)
          except Exception as e:
              print("Delete error:", e)
          EOF
