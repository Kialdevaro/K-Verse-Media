  <!--SKRIP LOGIKA & INTERAKSI UI-->
  <script>
    const memoryStore = {};
    const safeStorage = {
      getItem: function(key) {
        try { return localStorage.getItem(key); } catch(e) { return memoryStore[key] || null; }
      },
      setItem: function(key, val) {
        try { localStorage.setItem(key, val); } catch(e) { memoryStore[key] = val; }
      }
    };

    window.KVerseUI = {
      switchTab: function(tab) {
        ['feed', 'rank', 'profile'].forEach(t => {
          const el = document.getElementById('view-' + t);
          if(el) el.style.display = (t === tab) ? 'flex' : 'none';
        });
        safeStorage.setItem('kverse_active_tab', tab);
        
        if(tab === 'feed' && typeof window.KVerseApp === 'object' && window.KVerseApp.renderFeed) window.KVerseApp.renderFeed();
        if(tab === 'rank' && typeof window.KVerseApp === 'object' && window.KVerseApp.renderLeaderboard) window.KVerseApp.renderLeaderboard();
        if(tab === 'profile' && typeof window.KVerseApp === 'object' && window.KVerseApp.renderProfile) window.KVerseApp.renderProfile();
      },
      clearImg: function() {
        if(typeof window.KVerseApp === 'object') window.KVerseApp.tempBase64 = null;
        const pBox = document.getElementById('preview-box');
        const pFile = document.getElementById('post-file');
        if(pBox) pBox.style.display = 'none';
        if(pFile) pFile.value = '';
      },
      closeModal: function() {
        const modal = document.getElementById('detail-modal');
        if(modal) modal.style.display = 'none';
        if(typeof window.KVerseApp === 'object') window.KVerseApp.activePost = null;
      }
    };

    document.addEventListener('click', function(e) {
      const tabBtn = e.target.closest('.nav-tab-btn');
      if (tabBtn) {
        window.KVerseUI.switchTab(tabBtn.getAttribute('data-tab'));
        return;
      }

      const openBtn = e.target.closest('.open-post-btn');
      if (openBtn) {
        const postId = openBtn.getAttribute('data-id');
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.openDetail) {
          window.KVerseApp.openDetail(postId);
        }
        return;
      }

      if (e.target.id === 'select-img-btn') {
        document.getElementById('post-file').click();
        return;
      }

      if (e.target.id === 'clear-img-btn') {
        window.KVerseUI.clearImg();
        return;
      }

      if (e.target.id === 'submit-post-btn') {
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.submitPost) window.KVerseApp.submitPost();
        return;
      }

      if (e.target.id === 'auth-btn') {
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.toggleAuth) window.KVerseApp.toggleAuth();
        return;
      }

      if (e.target.closest('#avatar-trigger')) {
        document.getElementById('avatar-file-input').click();
        return;
      }

      if (e.target.id === 'close-modal-btn') {
        window.KVerseUI.closeModal();
        return;
      }

      if (e.target.id === 'modal-like-btn') {
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.pressLike) window.KVerseApp.pressLike();
        return;
      }

      if (e.target.id === 'modal-del-btn') {
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.pressDelete) window.KVerseApp.pressDelete();
        return;
      }

      if (e.target.id === 'modal-comment-submit-btn') {
        if(typeof window.KVerseApp === 'object' && window.KVerseApp.submitComment) window.KVerseApp.submitComment();
        return;
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const savedTab = safeStorage.getItem('kverse_active_tab') || 'feed';
      window.KVerseUI.switchTab(savedTab);

      const postFileInput = document.getElementById('post-file');
      if (postFileInput) {
        postFileInput.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if(file && typeof window.KVerseApp === 'object' && window.KVerseApp.handleImageSelect) {
            window.KVerseApp.handleImageSelect(file);
          }
        });
      }

      const avatarFileInput = document.getElementById('avatar-file-input');
      if (avatarFileInput) {
        avatarFileInput.addEventListener('change', function(e) {
          if(typeof window.KVerseApp === 'object' && window.KVerseApp.uploadNewAvatar) {
            window.KVerseApp.uploadNewAvatar(e);
          }
        });
      }

      const commentInput = document.getElementById('modal-comment-input');
      if (commentInput) {
        commentInput.addEventListener('keypress', function(e) {
          if(e.key === 'Enter' && typeof window.KVerseApp === 'object' && window.KVerseApp.submitComment) {
            window.KVerseApp.submitComment();
          }
        });
      }
    });
  </script>

    function compressAndResizeImage(file, callback, maxWidth = 350, quality = 0.4) {
      const reader = new FileReader();
      reader.onerror = function() { alert("Gagal membaca file gambar."); };
      reader.onload = function(e) {
        const img = new Image();
        img.onerror = function() { alert("Format gambar tidak didukung."); };
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
