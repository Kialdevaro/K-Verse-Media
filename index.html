    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function safeParseArray(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val;
      try { const p = JSON.parse(val); return Array.isArray(p) ? p : []; } catch(e) { return []; }

    function isUserOwner(user) {

    async function checkUserPhotoCount(uid) {
      try {
        const { count, error } = await supabase
          .from('kverse_posts')
          .select('*', { count: 'exact', head: true })
          .eq('author_uid', uid)
          .not('image', 'is', null)
          .neq('image', '');
        if (error) throw error;
        return count || 0;
      } catch (err) {
        console.error("Gagal mengecek kuota foto:", err);
        return 0;
      }
    }

    async function uploadToSupabaseStorage(file, folder = 'posts') {
      if (!file) return '';
      
      // Validasi ekstensi/tipe file ketat untuk keamanan
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowedTypes.includes(file.type)) {
        throw new Error("Format file harus berupa JPG, PNG, atau WebP!");
      }

      // Validasi ukuran maksimal file (3 MB)
      if (file.size > 3 * 1024 * 1024) {
        throw new Error("Ukuran file maksimal adalah 3 MB!");
      }

      if (currentUser && !isUserOwner(currentUser)) {
        const uploadedCount = await checkUserPhotoCount(currentUser.uid);
        if (uploadedCount >= 50) {
          throw new Error("Batas maksimal jatah 50 foto untuk akun Anda telah tercapai!");
        }
      }

      const fileExt = file.name.split('.').pop();
      const fileName = `${folder}_${currentUser.uid}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
      
      const { data, error } = await supabase.storage
        .from('Photos')
        .upload(fileName, file);

      if (error) throw error;

      const { data: { publicUrl } } = supabase.storage
        .from('Photos')
        .getPublicUrl(fileName);

      return publicUrl;
    }
          window.KVerseUI = {

        try {
          ['feed', 'rank', 'profile'].forEach(t => {
            const el = document.getElementById('view-' + t);
            if(el) el.style.display = (t === tab) ? 'flex' : 'none';
          });
          localStorage.setItem('kverse_active_tab', tab);
          
          if(tab === 'feed') { try { renderFeed(); } catch(e) { console.error(e); } }
          if(tab === 'rank') { try { renderLeaderboard(); } catch(e) { console.error(e); } }
          if(tab === 'profile') { try { renderProfile(); } catch(e) { console.error(e); } }
        } catch(err) {
          console.error("Tab switch error:", err);
        }
      },

        try {

          if(modal) modal.style.display = 'none';
          activePost = null;
        } catch(e) { console.error(e); }
      }
    };

    document.addEventListener('click', e => {
      try {
        const tabBtn = e.target.closest('.nav-tab-btn');
        if(tabBtn) { KVerseUI.switchTab(tabBtn.getAttribute('data-tab')); return; }
        
        const openBtn = e.target.closest('.open-post-btn');
        if(openBtn) { openDetail(openBtn.getAttribute('data-id')); return; }

        if(e.target.closest('#select-img-btn')) { document.getElementById('post-file').click(); return; }
        if(e.target.closest('#clear-img-btn')) {

          document.getElementById('preview-box').style.display = 'none'; 
          document.getElementById('post-file').value = '';

        }
        if(e.target.closest('#submit-post-btn')) { submitPost(); return; }
        if(e.target.closest('#auth-btn')) { toggleAuth(); return; }

        if(e.target.closest('#modal-like-btn')) { pressLike(); return; }
        if(e.target.closest('#modal-del-btn')) { pressDelete(); return; }

    function initRealtimeSubscription() {
      try {
        supabase
          .channel('public:kverse_posts')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'kverse_posts' }, payload => {
            const activeTab = localStorage.getItem('kverse_active_tab') || 'feed';
            if (activeTab === 'feed') {
              renderFeed(false);
            }
            if (activePost && payload.new && payload.new.id === activePost.id) {
              activePost = payload.new;
              openDetail(activePost.id);
            }
          })
          .subscribe();
      } catch (err) {
        console.error("Realtime subscription error:", err);
      }
    }

    function startOrganicXpTimer() {
      if (!currentUser) return;
      const keyStart = 'kverse_timer_' + currentUser.uid;
      let startTime = localStorage.getItem(keyStart);
      if (!startTime) {
        startTime = Date.now().toString();
        localStorage.setItem(keyStart, startTime);
      }

      const thirtyMins = 30 * 60 * 1000;
      const elapsed = Date.now() - parseInt(startTime);

      if (elapsed >= thirtyMins) {
        claimOrganicXp();
      } else {
        setTimeout(() => claimOrganicXp(), thirtyMins - elapsed);
      }
    }

    async function claimOrganicXp() {
      try {
        if (!currentUser) return;
        const randomXp = Math.floor(Math.random() * 21) + 30; 
        currentUser.xp = (currentUser.xp || 0) + randomXp;

        await supabase.from('kverse_users').update({ xp: currentUser.xp }).eq('uid', currentUser.uid);
        localStorage.setItem('kverse_timer_' + currentUser.uid, Date.now().toString());
        
        renderProfile();
        renderLeaderboard();
        alert(`🎉 Selamat! Anda aktif di web selama 30 menit dan mendapatkan +${randomXp} XP!`);
        startOrganicXpTimer();
      } catch(err) {
        console.error("Claim XP error:", err);
      }
    }

    async function renderFeed(isAppend = false) {
      const feedBox = document.getElementById('feed-box');
      if (!feedBox || isLoadingFeed) return;
      
      if (!isAppend) {
        feedPage = 0;
        hasMoreFeed = true;
        feedBox.innerHTML = '<p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Memuat linimasa...</p>';
      } else if (!hasMoreFeed) {
        return;
      }

      isLoadingFeed = true;

      try {
        const from = feedPage * feedLimit;
        const to = from + feedLimit - 1;

        let { data, error } = await supabase
          .from('kverse_posts')
          .select('*')
          .order('created_at', { ascending: false })
          .range(from, to);

        if(error) throw error;
        
        let posts = (data && data.length > 0) ? data : [];
        if (posts.length < feedLimit) {
          hasMoreFeed = false;
        }

        let combinedPosts = [];
        posts.forEach((p, idx) => {
          combinedPosts.push(p);
          if ((from + idx + 1) % 30 === 0) {
            const randomAd = professionalAds[Math.floor(Math.random() * professionalAds.length)];
            combinedPosts.push({ ...randomAd, id: 'ad-gen-' + Math.random().toString(36).substr(2, 9) });
          }
        });

        if (!isAppend && combinedPosts.length === 0) {
          const randomAd = professionalAds[Math.floor(Math.random() * professionalAds.length)];
          combinedPosts.unshift({ ...randomAd, id: 'ad-default-' + Math.random().toString(36).substr(2, 9) });
        }

        if (isAppend) {
          cachedPosts = cachedPosts.concat(combinedPosts);
        } else {
          cachedPosts = combinedPosts;
        }

        let html = isAppend ? feedBox.innerHTML : '';
        if (!isAppend && combinedPosts.length === 0) {
          feedBox.innerHTML = '<p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Belum ada postingan di beranda.</p>';
          isLoadingFeed = false;
          return;
        }

        if (!isAppend) html = '';

        combinedPosts.forEach((p) => {
          const likes = safeParseArray(p.likes);
          const comments = safeParseArray(p.comments);
          const isAd = p.is_ad || p.is_adsterra;
          const uniqueAdContainerId = 'ad-container-' + Math.random().toString(36).substr(2, 9);

          html += `
            <div style="background: ${isAd ? 'rgb(24, 18, 10)' : '#161616'}; border-radius: 10px; border: 1px solid ${isAd ? '#ff9900' : '#262626'}; padding: 12px; width: 100%; margin-bottom: 12px;">
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                <img src="${escapeHtml(p.author_avatar || 'https://cdn-icons-png.flaticon.com/512/147/147144.png')}" style="border-radius: 50%; height: 32px; width: 32px; object-fit: cover;" />
                <div>
                  <div style="color: ${isAd ? '#ff9900' : '#00ffcc'}; font-size: 12px; font-weight: bold;">${escapeHtml(p.author_name)}</div>
                  <div style="color: #777; font-size: 10px;">${p.created_at ? new Date(p.created_at).toLocaleString('id-ID') : 'Postingan Resmi'}</div>
                </div>
              </div>
              <p style="color: white; font-size: 13px; margin: 0 0 8px; word-break: break-word;">${escapeHtml(p.text || '')}</p>
              
              ${p.is_adsterra ? `
                <div class="adsterra-banner-slot" style="margin: 8px 0; text-align: center; background: black; border-radius: 6px; padding: 10px; min-height: 50px;">
                  <div id="${uniqueAdContainerId}"></div>
                </div>
              ` : ''}

              ${p.image ? `<div style="border-radius: 6px; margin-bottom: 8px; width: 100%;"><img src="${escapeHtml(p.image)}" style="width: 100%; height: auto; display: block; border-radius: 6px;" /></div>` : ''}
              
              ${isAd && p.link ? `
                <div style="margin-bottom: 8px;">
                  <a href="${escapeHtml(p.link)}" target="_blank" style="display: block; background: #ff5500; color: white; text-align: center; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none;">🔗 Kunjungi & Mainkan Sekarang</a>
                </div>
              ` : ''}
              
              <div style="display: flex; gap: 8px;">
                <button class="action-btn open-post-btn" data-id="${p.id}" style="background: rgba(255,153,0,0.15); border: 1px solid #ff9900; border-radius: 6px; color: #ff9900; font-size: 11px; font-weight: bold; padding: 4px 10px;">❤️ Suka (${likes.length})</button>
                <button class="action-btn open-post-btn" data-id="${p.id}" style="background: rgba(0,255,204,0.15); border: 1px solid #00ffcc; border-radius: 6px; color: #00ffcc; font-size: 11px; font-weight: bold; padding: 4px 10px;">💬 Komentar (${comments.length})</button>
              </div>
            </div>
          `;
        });
        
        feedBox.innerHTML = html;
        feedPage++;

        document.querySelectorAll('.adsterra-banner-slot').forEach(slot => {
          const targetDiv = slot.querySelector('div');
          if (targetDiv && !targetDiv.querySelector('script')) {
            const script = document.createElement('script');
            script.async = true;
            script.setAttribute('data-cfasync', 'false');
            script.src = "https://pl31662253.profitableratecpmnetwork.com/60b01d240fed7ec65a8fd993a9e50801/invoke.js";
            targetDiv.appendChild(script);
          }
        });

      } catch(err) {
        console.error("Render feed error:", err);
      } finally {
        isLoadingFeed = false;
      }
      }
          async function renderLeaderboard() {
      const rankBox = document.getElementById('rank-box');
      if (!rankBox) return;
      try {
        let { data, error } = await supabase.from('kverse_users').select('*').order('xp', { ascending: false }).limit(100);
        if(error) throw error;
        
        if (!data || data.length === 0) {
          rankBox.innerHTML = '<p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Belum ada data di papan skor.</p>';
          return;
        }

        let html = '';
        data.forEach((u, idx) => {
          let badge = '#' + (idx + 1);
          let color = '#888';
          if(idx === 0) color = '#ffD700';
          else if(idx === 1) color = '#C0C0C0';
          else if(idx === 2) color = '#CD7F32';

          html += `
            <div style="align-items: center; background: #161616; border-radius: 8px; border: 1px solid #262626; display: flex; justify-content: space-between; padding: 8px 12px; width: 100%;">
              <div style="align-items: center; display: flex; gap: 10px;">
                <span style="color: ${color}; font-size: 13px; font-weight: bold; width: 24px; text-align: center;">${badge}</span>
                <img src="${escapeHtml(u.avatar || 'https://cdn-icons-png.flaticon.com/512/147/147144.png')}" style="border-radius: 50%; height: 32px; width: 32px; object-fit: cover;" />
                <div>
                  <div style="color: white; font-size: 12px; font-weight: bold;">${escapeHtml(u.name)}</div>
                  <div style="color: #00ffcc; font-size: 10px;">ID: #${escapeHtml(u.friendId || 'KV-000000')}</div>
                </div>
              </div>
              <span style="color: #ff9900; font-size: 12px; font-weight: bold;">${formatNum(u.xp)} XP</span>
            </div>
          `;
        });
        rankBox.innerHTML = html;
      } catch(err) {
        console.error("Render leaderboard error:", err);
      }
    }

    function renderProfile() {
      try {
        const nameEl = document.getElementById('my-name');
        const idEl = document.getElementById('my-id');
        const xpEl = document.getElementById('my-xp');
        const avatarEl = document.getElementById('my-avatar');
        const authBtn = document.getElementById('auth-btn');

        if (currentUser) {
          if(nameEl) nameEl.textContent = currentUser.name;
          if(idEl) idEl.textContent = 'ID: #' + (currentUser.friendId || 'KV-000000');
          if(xpEl) xpEl.textContent = 'Total XP: ' + formatNum(currentUser.xp || 0);
          if(currentUser.avatar && avatarEl) avatarEl.src = currentUser.avatar;
          if(authBtn) authBtn.textContent = 'Keluar';
        } else {
          if(nameEl) nameEl.textContent = 'Tamu (Belum Login)';
          if(idEl) idEl.textContent = 'ID: #KV-000000';
          if(xpEl) xpEl.textContent = 'Total XP: 0';
          if(avatarEl) avatarEl.src = 'https://cdn-icons-png.flaticon.com/512/147/147144.png';
          if(authBtn) authBtn.textContent = 'Login';
        }
        renderMyGallery();
      } catch(err) {
        console.error("Render profile error:", err);
      }
    }

    async function renderMyGallery() {
      const galleryBox = document.getElementById('my-gallery');
      if (!galleryBox) return;
      if (!currentUser) {
        galleryBox.innerHTML = '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Login untuk melihat galeri.</span>';
        return;
      }
      try {
        let { data } = await supabase.from('kverse_posts').select('*').eq('author_uid', currentUser.uid);
        if (!data || data.length === 0) {
          galleryBox.innerHTML = '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Belum ada postingan.</span>';
          return;
        }
        let html = '';
        data.forEach(p => {
          if(p.image) {
            html += `<div class="action-btn open-post-btn" data-id="${p.id}" style="aspect-ratio: 1; background: black; border-radius: 6px; overflow: hidden;"><img src="${escapeHtml(p.image)}" style="height: 100%; width: 100%; object-fit: cover;" /></div>`;
          }
        });
        galleryBox.innerHTML = html || '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Belum ada foto.</span>';
      } catch(err) {
        console.error("Gallery error:", err);
      }
    }

    async function submitPost() {
      if (!currentUser) { alert("Silakan Login terlebih dahulu!"); KVerseUI.switchTab('profile'); return; }
      
      const lastPostKey = 'kverse_last_post_' + currentUser.uid;
      const lastTime = parseInt(localStorage.getItem(lastPostKey) || '0');
      const now = Date.now();
      if (now - lastTime < 15000) {
        alert("Harap tunggu 15 detik sebelum membuat postingan berikutnya.");
        return;
      }

      const textEl = document.getElementById('post-text');
      const text = textEl ? textEl.value.trim() : '';
      if (!text && !selectedImageFile) { alert("Tulis sesuatu atau pilih foto."); return; }

      try {
        let imageUrl = '';
        if (selectedImageFile) {
          imageUrl = await uploadToSupabaseStorage(selectedImageFile, 'posts');
        }

        await supabase.from('kverse_posts').insert([{
          author_uid: currentUser.uid,
          author_name: currentUser.name,
          author_avatar: currentUser.avatar,
          text: text,
          image: imageUrl,
          likes: JSON.stringify([]),
          comments: JSON.stringify([])
        }]);

        localStorage.setItem(lastPostKey, now.toString());
        if(textEl) textEl.value = '';
        selectedImageFile = null;
        const previewBox = document.getElementById('preview-box');
        if(previewBox) previewBox.style.display = 'none';
        renderFeed();
        alert("Berhasil memposting!");
      } catch(err) {
        console.error("Submit post error:", err);
        alert(err.message || "Gagal memposting.");
      }
    }

    async function openDetail(id) {
      try {
        activePost = cachedPosts.find(p => p.id == id);
        if(!activePost) return;

        document.getElementById('modal-text-tag').textContent = activePost.text || '';
        const imgBox = document.getElementById('modal-img-box');
        if(activePost.image) {
          imgBox.style.display = 'block';
          document.getElementById('modal-img-tag').src = activePost.image;
        } else {
          imgBox.style.display = 'none';
        }

        const likes = safeParseArray(activePost.likes);
        document.getElementById('modal-like-btn').innerHTML = `❤️ Suka (${likes.length})`;

        const delBtn = document.getElementById('modal-del-btn');
        if(currentUser && (currentUser.uid === activePost.author_uid || isUserOwner(currentUser)) && !activePost.is_ad && !activePost.is_adsterra) {
          delBtn.style.display = 'block';
        } else {
          delBtn.style.display = 'none';
        }

        const comments = safeParseArray(activePost.comments);
        let cHtml = '';
        if(comments.length === 0) cHtml = '<span style="color: #777;">Belum ada komentar.</span>';
        else comments.forEach(c => cHtml += `<div style="border-bottom: 1px solid #222; padding-bottom: 4px;"><strong style="color: #00ffcc;">${escapeHtml(c.name)}:</strong> ${escapeHtml(c.text)}</div>`);
        document.getElementById('modal-comments-box').innerHTML = cHtml;

        document.getElementById('detail-modal').style.display = 'flex';
      } catch(err) {
        console.error("Open detail error:", err);
      }
    }

    async function pressLike() {
      if(!currentUser || !activePost) { alert("Login dulu untuk menyukai!"); return; }
      try {
        let likes = safeParseArray(activePost.likes);
        const idx = likes.indexOf(currentUser.uid);
        if(idx > -1) likes.splice(idx, 1);
        else likes.push(currentUser.uid);

        if(!activePost.is_ad && !activePost.is_adsterra) {
          await supabase.from('kverse_posts').update({ likes: JSON.stringify(likes) }).eq('id', activePost.id);
        }
        activePost.likes = JSON.stringify(likes);
        document.getElementById('modal-like-btn').innerHTML = `❤️ Suka (${likes.length})`;
        renderFeed();
      } catch(err) {
        console.error("Like error:", err);
      }
    }

    async function submitComment() {
      if(!currentUser || !activePost) { alert("Login dulu untuk berkomentar!"); return; }
      const input = document.getElementById('modal-comment-input');
      const text = input ? input.value.trim() : '';
      if(!text) return;

      try {
        let comments = safeParseArray(activePost.comments);
        comments.push({ name: currentUser.name, text: text });
        if(!activePost.is_ad && !activePost.is_adsterra) {
          await supabase.from('kverse_posts').update({ comments: JSON.stringify(comments) }).eq('id', activePost.id);
        }
        activePost.comments = JSON.stringify(comments);
        if(input) input.value = '';

        let cHtml = '';
        comments.forEach(c => cHtml += `<div style="border-bottom: 1px solid #222; padding-bottom: 4px;"><strong style="color: #00ffcc;">${escapeHtml(c.name)}:</strong> ${escapeHtml(c.text)}</div>`);
        document.getElementById('modal-comments-box').innerHTML = cHtml;
        renderFeed();
      } catch(err) {
        console.error("Comment error:", err);
      }
    }

    async function pressDelete() {
      if(!activePost || activePost.is_ad || activePost.is_adsterra || !confirm("Hapus postingan ini?")) return;
      try {
        await supabase.from('kverse_posts').delete().eq('id', activePost.id);
        KVerseUI.closeModal();
        renderFeed();
        renderMyGallery();
      } catch(err) {
        console.error("Delete error:", err);
      }
    }

    async function toggleAuth() {
      try {
        if(currentUser) {
          if(confirm("Keluar akun?")) { await signOut(auth); currentUser = null; renderProfile(); renderLeaderboard(); }
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch(e) {
        console.error("Auth error:", e);
        alert("Gagal melakukan autentikasi.");
      }
    }
  </script>
