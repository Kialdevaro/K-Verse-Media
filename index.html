<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Monetag Monetization Tag -->
  <meta name="monetag" content="95a8f2b8cdea7849f3b2e23015abc99d">
  <title>K-Verse Media</title>
  <style>
    html, body {
      background-color: #0b0b0b !important;
      color: #ffffff !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      font-family: system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    * { box-sizing: border-box; }
    #kialdevaro-community-hub {
      max-width: 100% !important;
      width: 100% !important;
      min-height: 100vh !important;
      margin: 0 !important;
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: rgb(16, 16, 16);
    }
    .tab-view { display: flex; flex-direction: column; width: 100%; flex: 1; }
    .action-btn { cursor: pointer !important; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>

  <div id="kialdevaro-community-hub">
    <!-- HEADER -->
    <div style="align-items: center; border-bottom: 1px solid rgb(34, 34, 34); display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; width: 100%;">
      <div>
        <h3 style="color: #00ffcc; font-size: 16px; font-weight: 700; margin: 0px 0px 2px;">🌐 K-Verse Media</h3>
        <span style="color: #888888; font-size: 11px;">Media Digital Kialdevaro Group</span>
      </div>
      <a href="https://kialdevarogamesid.blogspot.com/p/kialdevaro-game_01127593984.html" target="_blank" style="background: rgb(255, 85, 0); border-radius: 6px; color: white; font-size: 11px; font-weight: bold; padding: 6px 12px; text-decoration: none; white-space: nowrap;">Game Hub</a>
    </div>

    <!-- NAVIGASI TAB -->
    <div style="display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; width: 100%;">
      <button id="nav-feed" class="nav-tab-btn" data-tab="feed" style="background: rgb(24, 24, 24); border-radius: 8px; border: 1px solid rgb(0, 255, 204); color: #00ffcc; cursor: pointer; font-size: 12px; font-weight: bold; padding: 8px 4px; text-align: center;">Beranda</button>
      <button id="nav-rank" class="nav-tab-btn" data-tab="rank" style="background: rgb(24, 24, 24); border-radius: 8px; border: 1px solid rgb(255, 153, 0); color: #ff9900; cursor: pointer; font-size: 12px; font-weight: bold; padding: 8px 4px; text-align: center;">Papan Skor</button>
      <button id="nav-profile" class="nav-tab-btn" data-tab="profile" style="background: rgb(24, 24, 24); border-radius: 8px; border: 1px solid rgb(255, 193, 7); color: #ffc107; cursor: pointer; font-size: 12px; font-weight: bold; padding: 8px 4px; text-align: center;">Profil Saya</button>
    </div>

    <!-- 1. TAB BERANDA -->
    <div id="view-feed" class="tab-view" style="display: flex;">
      <div style="background: rgb(22, 22, 22); border-radius: 10px; border: 1px solid rgb(38, 38, 38); margin-bottom: 12px; padding: 12px; width: 100%;">
        <textarea id="post-text" placeholder="Bagikan aktivitas atau momen seru hari ini..." style="background: rgb(13, 13, 13); border-radius: 6px; border: 1px solid rgb(34, 34, 34); box-sizing: border-box; color: white; font-size: 13px; height: 70px; margin-bottom: 8px; outline: none; padding: 8px; resize: none; width: 100%;"></textarea>
        <div style="align-items: center; display: flex; justify-content: space-between; width: 100%;">
          <input accept="image/*" id="post-file" style="display: none;" type="file" />
          <button id="select-img-btn" class="action-btn" style="background: rgb(34, 34, 34); border-radius: 6px; border: 1px solid rgb(51, 51, 51); color: #00ffcc; font-size: 12px; padding: 6px 12px;">🖼 Pilih Foto</button>
          <button id="submit-post-btn" class="action-btn" style="background: rgb(0, 255, 204); border: none; border-radius: 6px; color: black; font-size: 12px; font-weight: bold; padding: 6px 16px;">Posting</button>
        </div>
        <div id="preview-box" style="display: none; height: 80px; margin-top: 8px; position: relative; width: 80px;">
          <img id="preview-tag" src="" style="border-radius: 6px; height: 100%; object-fit: cover; width: 100%;" />
          <button id="clear-img-btn" class="action-btn" style="background: rgb(255, 85, 0); border: none; border-radius: 50%; color: white; font-size: 10px; height: 22px; position: absolute; right: -5px; top: -5px; width: 22px;">X</button>
        </div>
      </div>
      <div id="feed-box" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
        <p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Memuat linimasa...</p>
      </div>
    </div>

    <!-- 2. TAB PAPAN SKOR -->
    <div id="view-rank" class="tab-view" style="display: none;">
      <h4 style="color: #ff9900; font-size: 14px; font-weight: 600; margin: 0px 0px 10px; width: 100%;">Papan Skor Global Anggota</h4>
      <div id="rank-box" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
        <p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Memuat papan skor...</p>
      </div>
    </div>

    <!-- 3. TAB PROFIL -->
    <div id="view-profile" class="tab-view" style="display: none;">
      <div style="align-items: center; background: rgb(22, 22, 22); border-radius: 10px; border: 1px solid rgb(38, 38, 38); display: flex; justify-content: space-between; margin-bottom: 12px; padding: 12px; width: 100%;">
        <div style="align-items: center; display: flex; gap: 10px; min-width: 0; flex: 1;">
          <div id="avatar-trigger" class="action-btn" style="position: relative; flex-shrink: 0;" title="Ketuk ganti foto">
            <img id="my-avatar" src="https://cdn-icons-png.flaticon.com/512/147/147144.png" style="border-radius: 50%; border: 2px solid rgb(255, 193, 7); height: 50px; object-fit: cover; width: 50px;" />
          </div>
          <input accept="image/*" id="avatar-file-input" style="display: none;" type="file" />
          <div style="min-width: 0; flex: 1;">
            <h4 id="my-name" style="color: #ffc107; font-size: 14px; margin: 0px 0px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Tamu (Belum Login)</h4>
            <span id="my-id" style="color: #00ffcc; display: block; font-size: 11px; font-weight: bold;">ID: #KV-000000</span>
            <span id="my-xp" style="color: #aaaaaa; font-size: 11px;">Total XP: 0</span>
          </div>
        </div>
        <button id="auth-btn" class="action-btn" style="background: white; border: none; border-radius: 6px; color: black; font-size: 12px; font-weight: bold; padding: 7px 12px; flex-shrink: 0; margin-left: 8px;">Login</button>
      </div>
      <h4 style="color: #ffc107; font-size: 13px; margin: 0px 0px 8px; width: 100%;">Galeri Postingan Anda</h4>
      <div id="my-gallery" style="display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); width: 100%; padding-bottom: 20px;"></div>
    </div>
  </div>

  <!-- MODAL DETAIL -->
  <div id="detail-modal" style="align-items: center; background: rgba(0,0,0,0.85); display: none; height: 100%; justify-content: center; left: 0px; padding: 12px; position: fixed; top: 0px; width: 100%; z-index: 99999;">
    <div style="background: rgb(22, 22, 22); border-radius: 12px; border: 1px solid rgb(51,51,51); max-height: 85vh; max-width: 450px; overflow-y: auto; padding: 14px; position: relative; width: 100%;">
      <button id="close-modal-btn" class="action-btn" style="background: rgb(255,85,0); border: none; border-radius: 50%; color: white; font-size: 12px; font-weight: bold; height: 28px; position: absolute; right: 10px; top: 10px; width: 28px;">X</button>
      <div id="modal-img-box" style="background: black; border-radius: 6px; display: none; margin-bottom: 10px; text-align: center;"><img id="modal-img-tag" style="max-height: 220px; max-width: 100%; object-fit: contain;" /></div>
      <p id="modal-text-tag" style="color: white; font-size: 13px; margin: 0px 0px 10px; word-break: break-word;"></p>
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 8px;">
        <button id="modal-like-btn" class="action-btn" style="background: rgba(255,153,0,0.15); border: 1px solid #ff9900; border-radius: 6px; color: #ff9900; font-size: 12px; font-weight: bold; padding: 5px 10px;">❤️ Suka (0)</button>
        <button id="modal-del-btn" class="action-btn" style="background: rgba(255,85,0,0.2); border: 1px solid #ff5500; border-radius: 6px; color: #ff5500; display: none; font-size: 11px; font-weight: bold; padding: 5px 10px;">Hapus</button>
      </div>
      <div style="color: #aaa; font-size: 12px; font-weight: bold; margin-bottom: 4px;">Komentar:</div>
      <div id="modal-comments-box" style="background: #131313; border-radius: 6px; display: flex; flex-direction: column; font-size: 12px; gap: 6px; max-height: 120px; overflow-y: auto; padding: 8px; margin-bottom: 10px;"></div>
      <div style="display: flex; gap: 6px;">
        <input id="modal-comment-input" placeholder="Tulis komentar..." style="background: #131313; border-radius: 6px; border: 1px solid #333; color: white; flex: 1; font-size: 12px; padding: 8px; outline: none;" type="text" />
        <button id="modal-comment-submit-btn" class="action-btn" style="background: #00ffcc; border: none; border-radius: 6px; color: black; font-size: 12px; font-weight: bold; padding: 8px 12px;">Kirim</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    let currentUser = null;
    let cachedPosts = [];
    let activePost = null;
    let tempBase64 = null;
    let supabase = null;
    let auth = null;
    let provider = null;

    const OWNER_EMAIL = "akunwildrift2020@gmail.com";
    const OWNER_FRIEND_ID = "KV-230901";

    // Dataset Iklan Profesional (Disisipkan setiap 30 postingan)
    const professionalAds = [
      {
        id: 'ad-gaming-01',
        author_name: 'Kialdevaro Gaming ⚡ [SPONSORED]',
        author_avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        text: '🎮 Ngebahas tentang Review Semua karakter game terlengkap, statistik mendalam, dan tips jago main game favoritmu! Kunjungi ulasan lengkapnya di sini.',
        image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80',
        link: 'https://kialdevaro-gamingid.blogspot.com/p/kialdevaro-gaming.html',
        likes: JSON.stringify(["1", "2"]),
        comments: JSON.stringify([{ name: "Admin", text: "Review karakternya lengkap banget!" }]),
        is_ad: true
      },
      {
        id: 'ad-hub-02',
        author_name: 'Kialdevaro Games Hub 🌐 [SPONSORED]',
        author_avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
        text: '🕹️ Perpustakaan Game terbesar di dunia! Mainkan ribuan game gratis sepuasnya, top-up game aman, serta temukan afiliasi belanja barang terbaik (baju, fashion, elektronik, games, teknologi, dan lain-lain).',
        image: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format&fit=crop&q=80',
        link: 'https://kialdevarogamesid.blogspot.com/p/kialdevaro-game_01127593984.html',
        likes: JSON.stringify(["1"]),
        comments: JSON.stringify([{ name: "Rider", text: "Tempat nongkrong gamer paling lengkap!" }]),
        is_ad: true
      }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCo8ggig1Gk2ioaTa3lb_QtHIawfb4DNt8",
      authDomain: "kialdevaro-gaming.firebaseapp.com",
      projectId: "kialdevaro-gaming",
      storageBucket: "kialdevaro-gaming.firebasestorage.app",
      messagingSenderId: "132103359095",
      appId: "1:132103359095:web:348c6caa7809441fc5d472",
      measurementId: "G-S9VS5FVR8L"
    };

    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    provider = new GoogleAuthProvider();

    const SUPABASE_URL = "https://szuntuuhxcetqafaazai.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6dW50dXVoeGNldHFhZmFhemFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDk2NzgsImV4cCI6MjEwNjUyNTY3OH0.0GKmzbPNYzWEHzuPhAIx-zmGZA6Sf2Y-jEQsD1hH5Kc";
    
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false }
    });

    function formatNum(num) { return new Intl.NumberFormat('id-ID').format(num || 0); }
    function safeParseArray(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val;
      try { const p = JSON.parse(val); return Array.isArray(p) ? p : []; } catch(e) { return []; }
    }

    function isUserOwner(user) {
      if (!user) return false;
      return (user.email && user.email.toLowerCase().trim() === OWNER_EMAIL) || (user.friendId && user.friendId.trim() === OWNER_FRIEND_ID);
    }

    window.KVerseUI = {
      switchTab: function(tab) {
        try {
          ['feed', 'rank', 'profile'].forEach(t => {
            const el = document.getElementById('view-' + t);
            if(el) el.style.display = (t === tab) ? 'flex' : 'none';
          });
          localStorage.setItem('kverse_active_tab', tab);
          if(tab === 'feed') renderFeed();
          if(tab === 'rank') renderLeaderboard();
          if(tab === 'profile') renderProfile();
        } catch(err) {
          console.error("Tab switch error:", err);
        }
      },
      closeModal: function() {
        document.getElementById('detail-modal').style.display = 'none';
        activePost = null;
      }
    };

    document.addEventListener('click', e => {
      try {
        const tabBtn = e.target.closest('.nav-tab-btn');
        if(tabBtn) { KVerseUI.switchTab(tabBtn.getAttribute('data-tab')); return; }
        
        const openBtn = e.target.closest('.open-post-btn');
        if(openBtn) { openDetail(openBtn.getAttribute('data-id')); return; }

        if(e.target.id === 'select-img-btn') { document.getElementById('post-file').click(); return; }
        if(e.target.id === 'clear-img-btn') { tempBase64 = null; document.getElementById('preview-box').style.display = 'none'; document.getElementById('post-file').value = ''; return; }
        if(e.target.id === 'submit-post-btn') { submitPost(); return; }
        if(e.target.id === 'auth-btn') { toggleAuth(); return; }
        if(e.target.id === 'close-modal-btn') { KVerseUI.closeModal(); return; }
        if(e.target.id === 'modal-like-btn') { pressLike(); return; }
        if(e.target.id === 'modal-del-btn') { pressDelete(); return; }
        if(e.target.id === 'modal-comment-submit-btn') { submitComment(); return; }
        if(e.target.closest('#avatar-trigger')) { document.getElementById('avatar-file-input').click(); return; }
      } catch(err) {
        console.error("Click error:", err);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      try {
        KVerseUI.switchTab(localStorage.getItem('kverse_active_tab') || 'feed');
        
        document.getElementById('post-file').addEventListener('change', ev => {
          const file = ev.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = e => {
            tempBase64 = e.target.result;
            document.getElementById('preview-box').style.display = 'block';
            document.getElementById('preview-tag').src = tempBase64;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('avatar-file-input').addEventListener('change', async ev => {
          const file = ev.target.files[0];
          if(!file || !currentUser) return;
          const reader = new FileReader();
          reader.onload = async e => {
            const base64 = e.target.result;
            currentUser.avatar = base64;
            await supabase.from('kverse_users').update({ avatar: base64 }).eq('uid', currentUser.uid);
            renderProfile();
            renderLeaderboard();
            alert("Foto profil diperbarui!");
          };
          reader.readAsDataURL(file);
        });
      } catch(err) {
        console.error("DOM load error:", err);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      try {
        if (user) {
          let { data } = await supabase.from('kverse_users').select('*').eq('uid', user.uid).maybeSingle();
          const isOwnerEmail = user.email && user.email.toLowerCase().trim() === OWNER_EMAIL;
          
          if (data) {
            currentUser = data;
            if (isOwnerEmail && currentUser.friendId !== OWNER_FRIEND_ID) {
              currentUser.friendId = OWNER_FRIEND_ID;
              await supabase.from('kverse_users').update({ friendId: OWNER_FRIEND_ID }).eq('uid', user.uid);
            }
          } else {
            currentUser = {
              uid: user.uid,
              name: user.displayName || 'Anggota K-Verse',
              email: user.email || '',
              avatar: user.photoURL || 'https://cdn-icons-png.flaticon.com/512/147/147144.png',
              friendId: isOwnerEmail ? OWNER_FRIEND_ID : ('KV-' + Math.floor(100000 + Math.random() * 900000)),
              xp: 0
            };
            await supabase.from('kverse_users').insert([currentUser]);
          }
          renderProfile();
          renderLeaderboard();
          startOrganicXpTimer();
        } else {
          currentUser = null;
          renderProfile();
        }
      } catch(err) {
        console.error("Auth state error:", err);
      }
    });

    function startOrganicXpTimer() {
      if (!currentUser) return;
      const keyStart = 'kverse_timer_' + currentUser.uid;
      let startTime = localStorage.getItem(keyStart);
      if (!startTime) {
        startTime = Date.now().toString();
        localStorage.setItem(keyStart, startTime);
      }

      const thirtyMins = 30 * 60 * 1000;
      const elapsed = Date.now() - parseInt(startTime);

      if (elapsed >= thirtyMins) {
        claimOrganicXp(keyStart);
      } else {
        setTimeout(() => claimOrganicXp(keyStart), thirtyMins - elapsed);
      }
    }

    async function claimOrganicXp(keyStart) {
      try {
        if (!currentUser) return;
        const claimedKey = 'kverse_claimed_' + currentUser.uid + '_' + keyStart;
        if (localStorage.getItem(claimedKey)) return;

        const randomXp = Math.floor(Math.random() * 21) + 30; 
        currentUser.xp = (currentUser.xp || 0) + randomXp;

        await supabase.from('kverse_users').update({ xp: currentUser.xp }).eq('uid', currentUser.uid);
        localStorage.setItem(claimedKey, 'true');
        localStorage.removeItem('kverse_timer_' + currentUser.uid);
        renderProfile();
        renderLeaderboard();
        alert(`🎉 Selamat! Anda aktif di web selama 30 menit dan mendapatkan +${randomXp} XP!`);
      } catch(err) {
        console.error("Claim XP error:", err);
      }
    }

    async function renderFeed() {
      const feedBox = document.getElementById('feed-box');
      if (!feedBox) return;
      try {
        let { data, error } = await supabase.from('kverse_posts').select('*').order('created_at', { ascending: false });
        
        let posts = (data && data.length > 0) ? data : [];
        
        // Sisipkan iklan profesional setiap 30 postingan
        let combinedPosts = [];
        posts.forEach((p, idx) => {
          combinedPosts.push(p);
          if ((idx + 1) % 30 === 0) {
            const adIndex = (Math.floor((idx + 1) / 30) - 1) % professionalAds.length;
            combinedPosts.push(professionalAds[adIndex]);
          }
        });

        // Jika belum ada postingan dari database sama sekali, tampilkan iklan promosi utama
        if (combinedPosts.length === 0) {
          combinedPosts = professionalAds;
        }

        cachedPosts = combinedPosts;

        let html = '';
        combinedPosts.forEach(p => {
          const likes = safeParseArray(p.likes);
          const comments = safeParseArray(p.comments);
          const isAd = p.is_ad;

          html += `
            <div style="background: ${isAd ? 'rgb(24, 18, 10)' : '#161616'}; border-radius: 10px; border: 1px solid ${isAd ? '#ff9900' : '#262626'}; padding: 12px; width: 100%;">
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                <img src="${p.author_avatar || 'https://cdn-icons-png.flaticon.com/512/147/147144.png'}" style="border-radius: 50%; height: 32px; width: 32px; object-fit: cover;" />
                <div>
                  <div style="color: ${isAd ? '#ff9900' : '#00ffcc'}; font-size: 12px; font-weight: bold;">${p.author_name}</div>
                  <div style="color: #777; font-size: 10px;">${p.created_at ? new Date(p.created_at).toLocaleString('id-ID') : 'Postingan Resmi'}</div>
                </div>
              </div>
              <p style="color: white; font-size: 13px; margin: 0 0 8px; word-break: break-word;">${p.text || ''}</p>
              ${p.image ? `<div style="background: black; border-radius: 6px; margin-bottom: 8px; text-align: center;"><img src="${p.image}" style="max-height: 220px; max-width: 100%; object-fit: contain;" /></div>` : ''}
              
              ${isAd && p.link ? `
                <div style="margin-bottom: 8px;">
                  <a href="${p.link}" target="_blank" style="display: block; background: #ff5500; color: white; text-align: center; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none;">🔗 Kunjungi & Mainkan Sekarang</a>
                </div>
              ` : ''}

              <div style="display: flex; gap: 8px;">
                <button class="action-btn open-post-btn" data-id="${p.id}" style="background: rgba(255,153,0,0.15); border: 1px solid #ff9900; border-radius: 6px; color: #ff9900; font-size: 11px; font-weight: bold; padding: 4px 10px;">❤️ Suka (${likes.length})</button>
                <button class="action-btn open-post-btn" data-id="${p.id}" style="background: rgba(0,255,204,0.15); border: 1px solid #00ffcc; border-radius: 6px; color: #00ffcc; font-size: 11px; font-weight: bold; padding: 4px 10px;">💬 Komentar (${comments.length})</button>
              </div>
            </div>
          `;
        });
        feedBox.innerHTML = html;
      } catch(err) {
        console.error("Render feed error:", err);
        feedBox.innerHTML = '<p style="color: #ff5500; font-size: 13px; text-align: center; padding: 20px;">Gagal memuat linimasa.</p>';
      }
    }

    async function renderLeaderboard() {
      const rankBox = document.getElementById('rank-box');
      if (!rankBox) return;
      try {
        let { data, error } = await supabase.from('kverse_users').select('*').order('xp', { ascending: false }).limit(100);
        
        if (!data || data.length === 0) {
          rankBox.innerHTML = '<p style="color: #777; font-size: 13px; text-align: center; padding: 20px;">Belum ada data di papan skor.</p>';
          return;
        }

        let html = '';
        data.forEach((u, idx) => {
          let badge = '#' + (idx + 1);
          let color = '#888';
          if(idx === 0) color = '#ffD700';
          else if(idx === 1) color = '#C0C0C0';
          else if(idx === 2) color = '#CD7F32';

          html += `
            <div style="align-items: center; background: #161616; border-radius: 8px; border: 1px solid #262626; display: flex; justify-content: space-between; padding: 8px 12px; width: 100%;">
              <div style="align-items: center; display: flex; gap: 10px;">
                <span style="color: ${color}; font-size: 13px; font-weight: bold; width: 24px; text-align: center;">${badge}</span>
                <img src="${u.avatar || 'https://cdn-icons-png.flaticon.com/512/147/147144.png'}" style="border-radius: 50%; height: 32px; width: 32px; object-fit: cover;" />
                <div>
                  <div style="color: white; font-size: 12px; font-weight: bold;">${u.name}</div>
                  <div style="color: #00ffcc; font-size: 10px;">ID: #${u.friendId || 'KV-000000'}</div>
                </div>
              </div>
              <span style="color: #ff9900; font-size: 12px; font-weight: bold;">${formatNum(u.xp)} XP</span>
            </div>
          `;
        });
        rankBox.innerHTML = html;
      } catch(err) {
        console.error("Render leaderboard error:", err);
        rankBox.innerHTML = '<p style="color: #ff5500; font-size: 13px; text-align: center; padding: 20px;">Gagal memuat papan skor.</p>';
      }
    }

    function renderProfile() {
      try {
        const nameEl = document.getElementById('my-name');
        const idEl = document.getElementById('my-id');
        const xpEl = document.getElementById('my-xp');
        const avatarEl = document.getElementById('my-avatar');
        const authBtn = document.getElementById('auth-btn');

        if (currentUser) {
          if(nameEl) nameEl.textContent = currentUser.name;
          if(idEl) idEl.textContent = 'ID: #' + (currentUser.friendId || 'KV-000000');
          if(xpEl) xpEl.textContent = 'Total XP: ' + formatNum(currentUser.xp || 0);
          if(currentUser.avatar && avatarEl) avatarEl.src = currentUser.avatar;
          if(authBtn) authBtn.textContent = 'Keluar';
        } else {
          if(nameEl) nameEl.textContent = 'Tamu (Belum Login)';
          if(idEl) idEl.textContent = 'ID: #KV-000000';
          if(xpEl) xpEl.textContent = 'Total XP: 0';
          if(avatarEl) avatarEl.src = 'https://cdn-icons-png.flaticon.com/512/147/147144.png';
          if(authBtn) authBtn.textContent = 'Login';
        }
        renderMyGallery();
      } catch(err) {
        console.error("Render profile error:", err);
      }
    }

    async function renderMyGallery() {
      const galleryBox = document.getElementById('my-gallery');
      if (!galleryBox) return;
      if (!currentUser) {
        galleryBox.innerHTML = '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Login untuk melihat galeri.</span>';
        return;
      }
      try {
        let { data } = await supabase.from('kverse_posts').select('*').eq('author_uid', currentUser.uid);
        if (!data || data.length === 0) {
          galleryBox.innerHTML = '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Belum ada postingan.</span>';
          return;
        }
        let html = '';
        data.forEach(p => {
          if(p.image) {
            html += `<div class="action-btn open-post-btn" data-id="${p.id}" style="aspect-ratio: 1; background: black; border-radius: 6px; overflow: hidden;"><img src="${p.image}" style="height: 100%; width: 100%; object-fit: cover;" /></div>`;
          }
        });
        galleryBox.innerHTML = html || '<span style="color: #777; font-size: 12px; grid-column: span 3; text-align: center;">Belum ada foto.</span>';
      } catch(err) {
        console.error("Gallery error:", err);
      }
    }

    async function submitPost() {
      if (!currentUser) { alert("Silakan Login terlebih dahulu!"); KVerseUI.switchTab('profile'); return; }
      const textEl = document.getElementById('post-text');
      const text = textEl ? textEl.value.trim() : '';
      const image = tempBase64 || '';
      if (!text && !image) { alert("Tulis sesuatu atau pilih foto."); return; }

      try {
        await supabase.from('kverse_posts').insert([{
          author_uid: currentUser.uid,
          author_name: currentUser.name,
          author_avatar: currentUser.avatar,
          text: text,
          image: image,
          likes: JSON.stringify([]),
          comments: JSON.stringify([])
        }]);

        if(textEl) textEl.value = '';
        tempBase64 = null;
        const previewBox = document.getElementById('preview-box');
        if(previewBox) previewBox.style.display = 'none';
        renderFeed();
        alert("Berhasil memposting!");
      } catch(err) {
        console.error("Submit post error:", err);
        alert("Gagal memposting.");
      }
    }

    async function openDetail(id) {
      try {
        activePost = cachedPosts.find(p => p.id == id);
        if(!activePost) return;

        document.getElementById('modal-text-tag').textContent = activePost.text || '';
        const imgBox = document.getElementById('modal-img-box');
        if(activePost.image) {
          imgBox.style.display = 'block';
          document.getElementById('modal-img-tag').src = activePost.image;
        } else {
          imgBox.style.display = 'none';
        }

        const likes = safeParseArray(activePost.likes);
        document.getElementById('modal-like-btn').innerHTML = `❤️ Suka (${likes.length})`;

        const delBtn = document.getElementById('modal-del-btn');
        if(currentUser && (currentUser.uid === activePost.author_uid || isUserOwner(currentUser)) && !activePost.is_ad) {
          delBtn.style.display = 'block';
        } else {
          delBtn.style.display = 'none';
        }

        const comments = safeParseArray(activePost.comments);
        let cHtml = '';
        if(comments.length === 0) cHtml = '<span style="color: #777;">Belum ada komentar.</span>';
        else comments.forEach(c => cHtml += `<div style="border-bottom: 1px solid #222; padding-bottom: 4px;"><strong style="color: #00ffcc;">${c.name}:</strong> ${c.text}</div>`);
        document.getElementById('modal-comments-box').innerHTML = cHtml;

        document.getElementById('detail-modal').style.display = 'flex';
      } catch(err) {
        console.error("Open detail error:", err);
      }
    }

    async function pressLike() {
      if(!currentUser || !activePost) { alert("Login dulu untuk menyukai!"); return; }
      try {
        let likes = safeParseArray(activePost.likes);
        const idx = likes.indexOf(currentUser.uid);
        if(idx > -1) likes.splice(idx, 1);
        else likes.push(currentUser.uid);

        if(!activePost.is_ad) {
          await supabase.from('kverse_posts').update({ likes: JSON.stringify(likes) }).eq('id', activePost.id);
        }
        activePost.likes = JSON.stringify(likes);
        document.getElementById('modal-like-btn').innerHTML = `❤️️ Suka (${likes.length})`;
        renderFeed();
      } catch(err) {
        console.error("Like error:", err);
      }
    }

    async function submitComment() {
      if(!currentUser || !activePost) { alert("Login dulu untuk berkomentar!"); return; }
      const input = document.getElementById('modal-comment-input');
      const text = input ? input.value.trim() : '';
      if(!text) return;

      try {
        let comments = safeParseArray(activePost.comments);
        comments.push({ name: currentUser.name, text: text });
        if(!activePost.is_ad) {
          await supabase.from('kverse_posts').update({ comments: JSON.stringify(comments) }).eq('id', activePost.id);
        }
        activePost.comments = JSON.stringify(comments);
        if(input) input.value = '';

        let cHtml = '';
        comments.forEach(c => cHtml += `<div style="border-bottom: 1px solid #222; padding-bottom: 4px;"><strong style="color: #00ffcc;">${c.name}:</strong> ${c.text}</div>`);
        document.getElementById('modal-comments-box').innerHTML = cHtml;
        renderFeed();
      } catch(err) {
        console.error("Comment error:", err);
      }
    }

    async function pressDelete() {
      if(!activePost || activePost.is_ad || !confirm("Hapus postingan ini?")) return;
      try {
        await supabase.from('kverse_posts').delete().eq('id', activePost.id);
        KVerseUI.closeModal();
        renderFeed();
        renderMyGallery();
      } catch(err) {
        console.error("Delete error:", err);
      }
    }

    async function toggleAuth() {
      try {
        if(currentUser) {
          if(confirm("Keluar akun?")) { await signOut(auth); currentUser = null; renderProfile(); renderLeaderboard(); }
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch(e) {
        console.error("Auth error:", e);
        alert("Gagal melakukan autentikasi.");
      }
    }
  </script>
</body>
</html>
